name: Feature request
description: Suggest a new defense layer or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / gap
      description: What spam or attack pattern gets through, or what's awkward to use?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed change
      description: The layer or change you'd add, and where it fits in the stack.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
