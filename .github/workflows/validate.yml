name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PHP syntax check (templates)
        run: |
          fail=0
          for f in templates/*.php; do
            echo "== $f"
            php -l "$f" || fail=1
          done
          if [ "$fail" = 0 ]; then echo "OK: all PHP templates lint clean"; else exit 1; fi

      # The client used to hold `window.{SLUG}` at module scope, which is not
      # parseable JavaScript until the placeholders are substituted — so this
      # could not run at all. Bracket access fixed that, and the same change
      # let the suite import the client instead of transcribing its rules.
      - name: JS syntax check (templates)
        run: |
          fail=0
          for f in templates/*.js; do
            echo "== $f"
            node --check "$f" || fail=1
          done
          if [ "$fail" = 0 ]; then echo "OK: all JS templates parse"; else exit 1; fi

      - name: Shared validation config is valid JSON
        run: |
          python3 -c "import json; json.load(open('templates/validation.json'))"
          echo "OK: validation.json parses"

      # A machine path or a client name is scraped the moment it lands on a
      # public repo; this repo already shipped a personal domain that had to be
      # rewritten out of history. Cheaper to block on the PR.
      # The README says these catch JS/PHP rule drift. They did not run in CI,
      # and they could not run from a clone at all — both resolved the config
      # from the INSTALLED theme layout (resources/data/) rather than the repo
      # one, so the drift guarantee was documented but never enforced.
      - name: JS validation rules match validation.json
        run: node templates/contact.test.js

      - name: PHP validation rules match validation.json
        run: php templates/contact-validation.test.php

      - name: No private data
        run: python3 scripts/check-hygiene.py
